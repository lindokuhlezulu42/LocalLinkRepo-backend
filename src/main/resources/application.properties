spring.application.name=LocalLink API
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Database (PostgreSQL). All credentials come from environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/locallink_database}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Mail (Gmail SMTP by default). Set MAIL_USERNAME and MAIL_PASSWORD in the environment.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Session security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# File upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Application
locallink.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
locallink.mail.from=${MAIL_FROM:${spring.mail.username}}
locallink.admin.email=${LOCALLINK_ADMIN_EMAIL:admin@locallink.co.za}
locallink.admin.password=${LOCALLINK_ADMIN_PASSWORD}
